name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22.22.2 toolcache ships a broken bundled npm (missing promise-retry);
          # 22.22.3+ fixes that. npm 12 still requires ^22.22.2.
          node-version: "22.22.3"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@12.0.2 --activate
          npm --version
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Config tests
        run: npm run test:config
      - name: Handshake
        run: npm run smoke:handshake
      - name: Check versions
        run: npm run check:versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Publish
        run: npm publish --access public
