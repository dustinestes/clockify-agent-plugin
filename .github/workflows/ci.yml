name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Build, config tests, handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22.22.2 toolcache ships a broken bundled npm (missing promise-retry);
          # 22.22.3+ fixes that. npm 12 still requires ^22.22.2.
          node-version: "22.22.3"
      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@12.0.2 --activate
          npm --version
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Config tests
        run: npm run test:config
      - name: Versions
        run: npm run check:versions
      - name: Handshake
        run: npm run smoke:handshake
